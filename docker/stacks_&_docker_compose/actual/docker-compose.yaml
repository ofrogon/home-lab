---
services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual
    restart: unless-stopped
    user: "${PUID:?PUID not set}:${PGID:?PGID not set}"
    # ports:
    #   - 5006:5006
    environment:
      TZ: America/Montreal
      PUID: ${PUID:?PUID not set}
      PGID: ${PGID:?PGID not set}
      # Uncomment any of the lines below to set configuration options.
      # ACTUAL_HTTPS_KEY: /data/selfhost.key
      # ACTUAL_HTTPS_CERT: /data/selfhost.crt
      # ACTUAL_PORT: 5006
      # ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: 20
      # ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: 50
      # ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: 20
      # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
    volumes:
      - "/docker/actual/data:/data"
    healthcheck:
      # Enable health check for the instance
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.actual-http.entrypoints=web"
      - "traefik.http.routers.actual-http.rule=Host(`${TOP_URL:-actual}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.actual-https.entrypoints=websecure"
      - "traefik.http.routers.actual-https.rule=Host(`${TOP_URL:-actual}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.actual-https.tls=true"
      - "traefik.http.routers.actual-https.tls.certresolver=production"
      - "traefik.http.routers.actual-https.service=actual-svc"
      - "traefik.http.services.actual-svc.loadBalancer.server.port=5006"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
