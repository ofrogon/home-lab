---
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    user: "${PUID:?PUID not set}:${PGID:?PGID not set}"
    # ports:
    #  - 3000:3000
    environment:
      TZ: America/Montreal
      PUID: ${PUID:?PUID not set}
      PGID: ${PGID:?PGID not set}
      HOMEPAGE_ALLOWED_HOSTS: "${TOP_URL:-dash}.${BASE_URL:?BASE_URL not set}"
    volumes:
      - "/docker/homepage/config:/app/config"
      - "/docker/homepage/icons:/app/public/icons"
      - "/docker/homepage/images:/app/public/images"
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.homepage-http.entrypoints=web"
      - "traefik.http.routers.homepage-http.rule=Host(`${TOP_URL:-dash}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.homepage-https.entrypoints=websecure"
      - "traefik.http.routers.homepage-https.rule=Host(`${TOP_URL:-dash}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.homepage-https.tls=true"
      - "traefik.http.routers.homepage-https.tls.certresolver=production"
      - "traefik.http.routers.homepage-https.service=homepage-svc"
      - "traefik.http.services.homepage-svc.loadBalancer.server.port=3000"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
