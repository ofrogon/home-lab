---
services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: America/Montreal
      GID: "${GID-1000}"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik"
    volumes:
      - /docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - /docker/crowdsec/db:/var/lib/crowdsec/data/
      - /docker/crowdsec/config:/etc/crowdsec/
      - /docker/traefik/logs:/var/log/traefik/:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crowdsec-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

  bouncer-traefik:
    image: docker.io/fbonalair/traefik-crowdsec-bouncer:latest
    container_name: bouncer-traefik
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: America/Montreal
      CROWDSEC_BOUNCER_API_KEY: ${CROWDSEC_BOUNCER_API_KEY:?CROWDSEC_BOUNCER_API_KEY not set}
      CROWDSEC_AGENT_HOST: crowdsec:8080
    depends_on:
      crowdsec:
        condition: service_healthy
    networks:
      - front-end
      - crowdsec-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
  crowdsec-internal:
    internal: true
