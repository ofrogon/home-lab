---
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    user: "${PUID:?PUID not set}:${PGID:?PGID not set}"
    # ports:
    #   - 8080:80
    environment:
      TZ: America/Montreal
      PUID: ${PUID:?PUID not set}
      PGID: ${PGID:?PGID not set}
      DOMAIN: "https://${TOP_URL:-vaultwarden}.${BASE_URL:?BASE_URL not set}"
    volumes:
      - "/docker/vaultwarden/data:/data"
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden-http.entrypoints=web"
      - "traefik.http.routers.vaultwarden-http.rule=Host(`${TOP_URL:-vaultwarden}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.vaultwarden-https.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-https.rule=Host(`${TOP_URL:-vaultwarden}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.vaultwarden-https.tls=true"
      - "traefik.http.routers.vaultwarden-https.tls.certresolver=production"
      - "traefik.http.routers.vaultwarden-https.service=vaultwarden-svc"
      - "traefik.http.services.vaultwarden-svc.loadBalancer.server.port=80"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
