---

services:
  spliit:
    image: registry.local.abeaudoin.xyz/spliit2:latest
    container_name: spliit
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      POSTGRES_PRISMA_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@spliit-db
      POSTGRES_URL_NON_POOLING: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@spliit-db
      PUID: ${PUID:?PUID not set}
      PGID: ${PGID:?PGID not set}
    depends_on:
      spliit-db:
        condition: service_healthy
    networks:
      - front-end
      - spliit-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spliit-http.entrypoints=web"
      - 'traefik.http.routers.spliit-http.rule=Host(`${TOP_URL:-spliit}.${BASE_URL:?BASE_URL not set}`)'
      - "traefik.http.routers.spliit-https.entrypoints=websecure"
      - 'traefik.http.routers.spliit-https.rule=Host(`${TOP_URL:-spliit}.${BASE_URL:?BASE_URL not set}`)'
      - "traefik.http.routers.spliit-https.tls=true"
      - "traefik.http.routers.spliit-https.tls.certresolver=production"
      - "traefik.http.routers.spliit-https.service=spliit-svc"
      - "traefik.http.services.spliit-svc.loadBalancer.server.port=3000"
      - "traefik.docker.network=front-end"
      # External magic
      - "traefik.http.routers.spliit-https-public.entrypoints=websecurepublic"
      - "traefik.http.routers.spliit-https-public.rule=Host(`${TOP_URL:-spliit}.${PUBLIC_URL:?PUBLIC_URL not set}`)"
      - "traefik.http.routers.spliit-https-public.tls=true"
      - "traefik.http.routers.spliit-https-public.tls.certresolver=production"
      - "traefik.http.routers.spliit-https-public.service=spliit-svc"
      - "diun.enable=true"

  spliit-db:
    image: postgres:${POSTGRES_VERSION:?POSTGRES_VERSION not set}-alpine
    container_name: spliit-db
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    volumes:
      - "/docker/spliit/data:/var/lib/postgresql/data"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spliit-internal
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
  spliit-internal:
    internal: true
