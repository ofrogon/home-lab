---
services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - /docker/paperless/redisdata:/data
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - /docker/paperless/pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
    volumes:
      - /docker/paperless/data:/usr/src/paperless/data
      - /docker/paperless/media:/usr/src/paperless/media
      - /docker/paperless/export:/usr/src/paperless/export
      - /docker/paperless/consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresq
    networks:
      - front-end
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-http.entrypoints=web"
      - "traefik.http.routers.paperless-http.rule=Host(`${TOP_URL:-paperless}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.paperless-https.entrypoints=websecure"
      - "traefik.http.routers.paperless-https.rule=Host(`${TOP_URL:-paperless}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.paperless-https.tls=true"
      - "traefik.http.routers.paperless-https.tls.certresolver=production"
      - "traefik.http.routers.paperless-https.service=paperless-svc"
      - "traefik.http.services.paperless-svc.loadBalancer.server.port=8000"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true