---
services:
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - /docker/searxng/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - searxng-internal
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - "diun.enable=true"

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    #    ports:
    #      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/Montreal
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      UWSGI_WORKERS: ${SEARXNG_UWSGI_WORKERS:-4}
      UWSGI_THREADS: ${SEARXNG_UWSGI_THREADS:-4}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET not set}
      SEARXNG_IMAGE_PROXY: true
      SEARXNG_STATIC_USE_HASH: true
      SEARXNG_REDIS_URL: redis://valkey:6379/0
    volumes:
      - /docker/searxng:/etc/searxng:rw
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - front-end
      - searxng-internal
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.search-http.entrypoints=web"
      - "traefik.http.routers.search-http.rule=Host(`${TOP_URL:-search}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.search-https.entrypoints=websecure"
      - "traefik.http.routers.search-https.rule=Host(`${TOP_URL:-search}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.search-https.tls=true"
      - "traefik.http.routers.search-https.tls.certresolver=production"
      - "traefik.http.routers.search-https.service=search-svc"
      - "traefik.http.services.search-svc.loadBalancer.server.port=8080"
      - "traefik.docker.network=front-end"
      # External magic
      - "traefik.http.routers.search-https-public.entrypoints=websecurepublic"
      - "traefik.http.routers.search-https-public.rule=Host(`${TOP_URL:-search}.${PUBLIC_URL:?PUBLIC_URL not set}`)"
      - "traefik.http.routers.search-https-public.tls=true"
      - "traefik.http.routers.search-https-public.tls.certresolver=production"
      - "traefik.http.routers.search-https-public.service=search-svc"

networks:
  front-end:
    external: true
  searxng-internal:
    internal: true
