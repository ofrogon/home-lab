---
services:
  postgres:
    image: postgres:16-alpine
    container_name: linkwarden-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: America/Montreal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    volumes:
      - "/docker/linkwarden/pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linkwarden-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: America/Montreal
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@postgres:5432/postgres
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET not set}
      NEXTAUTH_URL: "https://${TOP_URL:-linkwarden}.${BASE_URL:?BASE_URL not set}"
    volumes:
      - "/docker/linkwarden/data:/data/data"
    env_file:
      - stack.env
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - front-end
      - linkwarden-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.linkwarden-http.entrypoints=web"
      - "traefik.http.routers.linkwarden-http.rule=Host(`${TOP_URL:-linkwarden}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.linkwarden-https.entrypoints=websecure"
      - "traefik.http.routers.linkwarden-https.rule=Host(`${TOP_URL:-linkwarden}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.linkwarden-https.tls=true"
      - "traefik.http.routers.linkwarden-https.tls.certresolver=production"
      - "traefik.http.routers.linkwarden-https.service=linkwarden-svc"
      - "traefik.http.services.linkwarden-svc.loadBalancer.server.port=3000"
      - "traefik.docker.network=front-end"

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: always
    stop_grace_period: 60s
    environment:
      TZ: America/Montreal
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY not set}
    volumes:
      - "/docker/linkwarden/meili_data:/meili_data"
    networks:
      - linkwarden-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
  linkwarden-internal:
    internal: true
