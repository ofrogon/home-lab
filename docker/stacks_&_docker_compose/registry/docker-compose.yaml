---
services:
  registry:
    image: registry:latest
    container_name: registry
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      UID: ${PUID:?PUID not set}
      GID: ${PGID:?PGID not set}
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/registry.password
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
    volumes:
      - "/docker/registry/registry.password:/auth/registry.password:ro"
      - "/docker/registry/data:/data"
    networks:
      - front-end
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.registry-http.entrypoints=web"
      - "traefik.http.routers.registry-http.rule=Host(`${TOP_URL:-registry}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.registry-https.entrypoints=websecure"
      - "traefik.http.routers.registry-https.rule=Host(`${TOP_URL:-registry}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.registry-https.tls=true"
      - "traefik.http.routers.registry-https.tls.certresolver=production"
      - "traefik.http.routers.registry-https.service=registry-svc"
      - "traefik.http.services.registry-svc.loadBalancer.server.port=5000"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
