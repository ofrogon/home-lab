name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    restart: "no"
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    entrypoint: ["/bin/sh", "-c"]
    environment:
      TZ: America/Montreal
    volumes:
      - /docker/opengym/out/img:/out/img
      - /docker/opengym/out/gif:/out/gif
    labels:
      - "diun.enable=true"

  # Passkey auth + per-user data (Node, no framework).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      PORT: 3000 # internal port (nginx proxies here) — do not change
      DATA_DIR: /data
    volumes:
      - /docker/opengym/data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
    env_file:
      - stack.env
    networks:
      - opengym-internal
    labels:
      - "diun.enable=true"

  # Serves the React frontend, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    volumes:
      - /docker/opengym/out/img:/usr/share/nginx/html/img:ro
      - /docker/opengym/out/gif:/usr/share/nginx/html/gif:ro
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - front-end
      - opengym-internal
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.opengym-http.entrypoints=web"
      - "traefik.http.routers.opengym-http.rule=Host(`${TOP_URL:-gym}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.opengym-https.entrypoints=websecure"
      - "traefik.http.routers.opengym-https.rule=Host(`${TOP_URL:-gym}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.opengym-https.tls=true"
      - "traefik.http.routers.opengym-https.tls.certresolver=production"
      - "traefik.http.routers.opengym-https.service=opengym-svc"
      - "traefik.http.services.opengym-svc.loadBalancer.server.port=80"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
  opengym-internal:
    internal: true
