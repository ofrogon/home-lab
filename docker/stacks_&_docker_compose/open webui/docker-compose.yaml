---
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    #user: "${PUID}:${PGID}"
    # ports:
    #  - "3000:8080"
    environment:
      TZ: America/Montreal
      UID: ${PUID:?PUID not set}
      GID: ${PGID:?PGID not set}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL not set}
    volumes:
      - "/docker/openwebui/data:/app/backend/data"
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.ai-http.entrypoints=web"
      - "traefik.http.routers.ai-http.rule=Host(`${TOP_URL:-ai}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.ai-https.entrypoints=websecure"
      - "traefik.http.routers.ai-https.rule=Host(`${TOP_URL:-ai}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.ai-https.tls=true"
      - "traefik.http.routers.ai-https.tls.certresolver=production"
      - "traefik.http.routers.ai-https.service=ai-svc"
      - "traefik.http.services.ai-svc.loadBalancer.server.port=8080"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
