---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptimekuma
    restart: unless-stopped
    # user: "${PUID}:${PGID}"
    # ports:
    #  - 3001:80
    environment:
      TZ: America/Montreal
      PUID: ${PUID:?PUID not set}
      PGID: ${PGID:?PGID not set}
    volumes:
      - "/docker/uptimekuma:/app/data"
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma-http.entrypoints=web"
      - "traefik.http.routers.uptime-kuma-http.rule=Host(`${TOP_URL:-uptime}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.uptime-kuma-https.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma-https.rule=Host(`${TOP_URL:-uptime}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.uptime-kuma-https.tls=true"
      - "traefik.http.routers.uptime-kuma-https.tls.certresolver=production"
      - "traefik.http.routers.uptime-kuma-https.service=uptime-kuma-svc"
      - "traefik.http.services.uptime-kuma-svc.loadBalancer.server.port=3001"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
