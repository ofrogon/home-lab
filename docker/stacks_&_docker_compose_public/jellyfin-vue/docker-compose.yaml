---

services:
  jellyfin_vue:
    image: ghcr.io/jellyfin/jellyfin-vue:unstable
    container_name: jellyfin_vue
    restart: unless-stopped
    # ports:
    #   - 8080:80
    environment:
      TZ: America/Montreal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.jellyvue-http.entrypoints=web"
      - "traefik.http.routers.jellyvue-http.rule=Host(`${TOP_URL:-jellyvue}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.jellyvue-https.entrypoints=websecure"
      - "traefik.http.routers.jellyvue-https.rule=Host(`${TOP_URL:-jellyvue}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.jellyvue-https.tls=true"
      - "traefik.http.routers.jellyvue-https.tls.certresolver=production"
      - "traefik.http.routers.jellyvue-https.service=jellyvue-svc"
      - "traefik.http.services.jellyvue-svc.loadBalancer.server.port=80"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
