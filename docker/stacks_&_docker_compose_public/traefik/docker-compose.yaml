---

services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: America/Montreal
      CLOUDFLARE_EMAIL: ${CLOUDFLARE_EMAIL:?CLOUDFLARE_EMAIL not set}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN not set}
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_API_DASHBOARD: "false"
      TRAEFIK_API_DISABLEDASHBOARDAD: "true"
      TRAEFIK_API_INSECURE: "false"
      TRAEFIK_PING: "true"
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: reject
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ALIASHEADERSSTRATEGY: reject
      TRAEFIK_ENTRYPOINTS_WEBSECUREPUBLIC_ADDRESS: ":8443"
      TRAEFIK_ENTRYPOINTS_WEBSECUREPUBLIC_FORWARDEDHEADERS_TRUSTEDIPS: ${TRAEFIK_TRUSTED_PROXIES:?TRAEFIK_TRUSTED_PROXIES not set}
      TRAEFIK_ENTRYPOINTS_WEBSECUREPUBLIC_HTTP_ALIASHEADERSSTRATEGY: reject
      TRAEFIK_ENTRYPOINTS_WEBSECUREPUBLIC_HTTP_MIDDLEWARES: crowdsec-bouncer@file
      TRAEFIK_CERTIFICATESRESOLVERS_STAGING_ACME_EMAIL: ${CLOUDFLARE_EMAIL:?CLOUDFLARE_EMAIL not set}
      TRAEFIK_CERTIFICATESRESOLVERS_STAGING_ACME_STORAGE: /etc/traefik/certs/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_STAGING_ACME_CASERVER: https://acme-staging-v02.api.letsencrypt.org/directory
      TRAEFIK_CERTIFICATESRESOLVERS_STAGING_ACME_DNSCHALLENGE_PROVIDER: cloudflare
      TRAEFIK_CERTIFICATESRESOLVERS_STAGING_ACME_DNSCHALLENGE_RESOLVERS: 1.1.1.1:53,8.8.8.8:53
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_EMAIL: ${CLOUDFLARE_EMAIL:?CLOUDFLARE_EMAIL not set}
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_STORAGE: /etc/traefik/certs/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_CASERVER: https://acme-v02.api.letsencrypt.org/directory
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_DNSCHALLENGE_PROVIDER: cloudflare
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_DNSCHALLENGE_RESOLVERS: 1.1.1.1:53,8.8.8.8:53
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://traefik-socket-proxy:2375
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/conf
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      TRAEFIK_SERVERSTRANSPORT_INSECURESKIPVERIFY: "true"
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_LOG_FILEPATH: /var/log/traefik/traefik.log
      TRAEFIK_ACCESSLOG_FILEPATH: /var/log/traefik/access.log
    volumes:
      - "/docker/traefik/conf/:/etc/traefik/conf/:ro"
      - "/docker/traefik/certs/:/etc/traefik/certs/"
      - "/docker/traefik/logs/:/var/log/traefik/"
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      traefik-socket-proxy:
        condition: service_healthy
    networks:
      - front-end
      - socket-proxy
    dns:
      - 45.90.28.194
      - 45.90.30.194
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

  traefik-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: traefik-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
  socket-proxy:
    internal: true
