services:
  diun:
    image: crazymax/diun:4.33.0
    container_name: diun
    restart: always
    command: serve
    environment:
      TZ: America/Montreal
      LOG_LEVEL: info
      LOG_JSON: false
      DIUN_WATCH_WORKERS: 20
      DIUN_WATCH_SCHEDULE: 0 12 * * 0
      DIUN_WATCH_JITTER: 30s
      DIUN_PROVIDERS_DOCKER: true
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://diun-socket-proxy:2375
      DIUN_WATCH_RUNONSTARTUP: true
      DIUN_WATCH_FIRSTCHECKNOTIF: true
      DIUN_NOTIF_NTFY_ENDPOINT: https://${TOP_URL:-ntfy}.${BASE_URL:?BASE_URL not set}
      DIUN_NOTIF_NTFY_TOPIC: diun-public
      DIUN_NOTIF_NTFY_TAGS: whale
      DIUN_NOTIF_NTFY_TIMEOUT: 10s
      DIUN_NOTIF_NTFY_TOKEN: ${NTFY_TOKEN:?NTFY_TOKEN not set}
    volumes:
      - "/docker/diun/data:/data"
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      diun-socket-proxy:
        condition: service_healthy
    networks:
      - diun-egress
      - diun-socket
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

  diun-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: diun-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "0"
      IMAGES: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - diun-socket
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  diun-egress:
  diun-socket:
    internal: true
