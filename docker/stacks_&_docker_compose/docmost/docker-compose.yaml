---
services:
  docmost:
    image: docmost/docmost:latest
    container_name: docmost
    restart: unless-stopped
    stop_grace_period: 30s
    # ports:
    #   - "3000:3000"
    environment:
      TZ: America/Montreal
      APP_URL: "https://${TOP_URL:-docmost}.${BASE_URL:?BASE_URL not set}"
      APP_SECRET: ${APP_SECRET:?APP_SECRET not set}
      DATABASE_URL: "postgresql://docmost:${DB_PASSWORD:?DB_PASSWORD not set}@docmostsql:5432/docmost?schema=public"
      REDIS_URL: "redis://docmostredis:6379"
    volumes:
      - /docker/docmost/storage:/app/data/storage
    depends_on:
      docmostsql:
        condition: service_healthy
      docmostredis:
        condition: service_healthy
    networks:
      - front-end
      - docmost-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.docmost-http.entrypoints=web"
      - "traefik.http.routers.docmost-http.rule=Host(`${TOP_URL:-docmost}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.docmost-https.entrypoints=websecure"
      - "traefik.http.routers.docmost-https.rule=Host(`${TOP_URL:-docmost}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.docmost-https.tls=true"
      - "traefik.http.routers.docmost-https.tls.certresolver=production"
      - "traefik.http.routers.docmost-https.service=docmost-svc"
      - "traefik.http.services.docmost-svc.loadBalancer.server.port=3000"
      - "traefik.docker.network=front-end"

  docmostsql:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: America/Montreal
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    volumes:
      - /docker/docmost/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - docmost-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

  docmostredis:
    image: redis:7.2-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: America/Montreal
    volumes:
      - /docker/docmost/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docmost-internal
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
  docmost-internal:
    internal: true
