---

services:
  gluetun-private:
    image: qmcgaw/gluetun
    container_name: gluetun-private
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    # ports:
      # - 8000:8000/tcp # Gluetun web server
      # - 8388:8388/tcp # Shadowsocks
      # - 8388:8388/udp # Shadowsocks
      # - 8081:8081 # MeTube
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?VPN_SERVICE_PROVIDER not set} # mullvad
      VPN_TYPE: wireguard
      # Wireguard:
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?WIREGUARD_PRIVATE_KEY not set} # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/protonvpn.md
      # WIREGUARD_ADDRESSES: $WIREGUARD_ADDRESSES
      # Timezone for accurate log times
      TZ: ${TZ:?TZ not set}
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      UPDATER_PERIOD: 24h
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:?SERVER_COUNTRIES not set}
      # FIREWALL_OUTBOUND_SUBNETS: $FIREWALL_OUTBOUND_SUBNETS
    volumes:
      - "/docker/private/gluetun:/gluetun"
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=front-end"

      - "traefik.http.routers.gluetun-private-http.rule=Host(`${TOP_URL_GLUETUN:-gluetun-private}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.gluetun-private-http.entrypoints=web"
      - "traefik.http.routers.gluetun-private-https.rule=Host(`${TOP_URL_GLUETUN:-gluetun-private}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.gluetun-private-https.entrypoints=websecure"
      - "traefik.http.routers.gluetun-private-https.tls.certresolver=production"
      - "traefik.http.routers.gluetun-private-https.service=gluetun-private-svc"
      - "traefik.http.services.gluetun-private-svc.loadbalancer.server.port=8000"

      - "traefik.http.routers.metube-http.rule=Host(`${TOP_URL:-metube}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.metube-http.entrypoints=web"
      - "traefik.http.routers.metube-https.rule=Host(`${TOP_URL:-metube}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.metube-https.entrypoints=websecure"
      - "traefik.http.routers.metube-https.tls.certresolver=production"
      - "traefik.http.routers.metube-https.service=metube-svc"
      - "traefik.http.services.metube-svc.loadBalancer.server.port=8081"

  metube:
    image: ghcr.io/alexta69/metube:2026.09.29
    container_name: metube
    restart: unless-stopped
    user: "${METUBE_PUID:?METUBE_PUID not set}:${METUBE_PGID:?METUBE_PGID not set}"
    # ports:
    #   - "8081:8081"
    environment:
      TZ: ${TZ:?TZ not set}
      UID: ${METUBE_PUID:?METUBE_PUID not set}
      GID: ${METUBE_PGID:?METUBE_PGID not set}
      DELETE_FILE_ON_TRASHCAN: true
    volumes:
      - "/download/MeTube:/downloads"
    depends_on:
      gluetun-private:
        condition: service_healthy
    network_mode: "service:gluetun-private"
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
