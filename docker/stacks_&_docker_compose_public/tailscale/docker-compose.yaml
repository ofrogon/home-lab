---
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-home-lab}
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY not set}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: true
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - /docker/tailscale/state:/var/lib/tailscale
      - /docker/tailscale/config:/config:ro
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "diun.enable=true"

networks:
  front-end:
    external: true
