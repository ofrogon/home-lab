---
services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    restart: unless-stopped
    environment:
      TZ: America/Montreal
      PRIMARY: ${PRIMARY_URL:?PRIMARY_URL not set}|${PRIMARY_PASSWORD:?PRIMARY_PASSWORD not set}
      REPLICAS: ${SECONDARY_URL:?SECONDARY_URL not set}|${SECONDARY_PASSWORD:?SECONDARY_PASSWORD not set}
      FULL_SYNC: true
      CRON: 42 * * * *
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "diun.enable=true"
