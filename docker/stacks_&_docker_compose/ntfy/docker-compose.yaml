---
services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    restart: unless-stopped
    command:
      - serve
    user: "${PUID:?PUID not set}:${PGID:?PGID not set}"
    #    ports:
    #      - 80:80
    environment:
      TZ: America/Montreal

      # --- Identité / réseau ---------------------------------------------
      NTFY_BASE_URL: https://${TOP_URL:-ntfy}.${BASE_URL:?BASE_URL not set}
      # Port non privilégié : cohérent avec `user:` (pas de bind sur :80)
      NTFY_LISTEN_HTTP: ":2586"
      NTFY_BEHIND_PROXY: "true"

      # --- Stockage ------------------------------------------------------
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: "12h"
      NTFY_AUTH_FILE: /var/cache/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all

      # --- Pièces jointes (limites < 100 MB du tunnel Cloudflare) --------
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: "5G"
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: "50M"
      NTFY_ATTACHMENT_EXPIRY_DURATION: "12h"

      # --- Comptes -------------------------------------------------------
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_RESERVATIONS: "true"

      # --- iOS : indispensable pour recevoir via APNs --------------------
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh

      # --- Web Push (notifications navigateur, onglet fermé) -------------
      # Générer les clés une fois : voir étapes manuelles
      NTFY_WEB_PUSH_PUBLIC_KEY: ${NTFY_WEB_PUSH_PUBLIC_KEY:?NTFY_WEB_PUSH_PUBLIC_KEY not set}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${NTFY_WEB_PUSH_PRIVATE_KEY:?NTFY_WEB_PUSH_PRIVATE_KEY not set}
      NTFY_WEB_PUSH_FILE: /var/cache/ntfy/webpush.db
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${NTFY_WEB_PUSH_EMAIL:?NTFY_WEB_PUSH_EMAIL not set}

      # --- Divers --------------------------------------------------------
      NTFY_KEEPALIVE_INTERVAL: "45s"
      NTFY_MANAGER_INTERVAL: "1h"
      NTFY_LOG_LEVEL: info
    volumes:
      - /docker/ntfy/cache:/var/cache/ntfy
      - /docker/ntfy/etc:/etc/ntfy
    healthcheck: # optional: remember to adapt the host:port to your environment
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:2586/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - front-end
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy-http.entrypoints=web"
      - "traefik.http.routers.ntfy-http.rule=Host(`${TOP_URL:-ntfy}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.ntfy-https.entrypoints=websecure"
      - "traefik.http.routers.ntfy-https.rule=Host(`${TOP_URL:-ntfy}.${BASE_URL:?BASE_URL not set}`)"
      - "traefik.http.routers.ntfy-https.tls=true"
      - "traefik.http.routers.ntfy-https.tls.certresolver=production"
      - "traefik.http.routers.ntfy-https.service=ntfy-svc"
      - "traefik.http.services.ntfy-svc.loadBalancer.server.port=2586"
      - "traefik.docker.network=front-end"

networks:
  front-end:
    external: true
